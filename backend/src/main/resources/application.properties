spring.application.name=backend

# Database Configuration (Defaults to SQLite for local dev, overridden by env vars on Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:helpdesk.db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server port
server.port=8080
